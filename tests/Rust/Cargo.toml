[package]
name = "sqlprovider_fable_smoke"
version = "0.1.0"
edition = "2021"

# Fable writes the entry point as Program.rs at the output root, not src/main.rs.
[[bin]]
name = "sqlprovider_fable_smoke"
path = "Program.rs"

[dependencies]
# "threaded" is not optional: Fable's Rust runtime only defines Async under it.
fable_library_rust = { path = "./fable_modules/fable-library-rust", features = [
    "threaded",
] }

# One driver set for all three engines; the URL scheme picks between them.
# The sqlite feature compiles SQLite from source, so no system library is needed.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "any",
    "sqlite",
    "postgres",
    "mysql",
] }

tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
